<!DOCTYPE html>
<html>
<head>

<title>Submit Complaint</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

body{
background: radial-gradient(circle at top, #1e1b4b, #0f172a, #020617);
color:#e5e7eb;
font-family:'Inter',sans-serif;

/* ✅ ADD THIS */
min-height:100vh;
display:flex;
flex-direction:column;
}

.card{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
border-radius:12px;
}

/* INPUT */
.form-control{
background:#fff;
color:#111;
}

/* BUTTON */
.btn-submit{
background:#8b5cf6;
color:white;
border:none;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark bg-dark px-3">
<a class="navbar-brand">ServiceDesk</a>
<a href="/dashboard/" class="btn btn-light">Dashboard</a>
</nav>

<div class="container mt-5 flex-grow-1">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card p-4">

<h3 class="mb-4 text-center text-white">Submit Complaint</h3>

{% if messages %}
  {% for message in messages %}
    <div class="alert alert-success text-center">
      {{ message }}
    </div>
  {% endfor %}
{% endif %}

<form method="POST">

{% csrf_token %}

<input type="text" name="title" class="form-control mb-3" placeholder="Title" required>

<textarea name="description" class="form-control mb-3" rows="4" required></textarea>

<button class="btn btn-submit w-100">Submit Complaint</button>

</form>

</div>

</div>

</div>

</div>

<footer class="text-center mt-5 p-3 text-white">
ServiceDesk © 2026 | Complaint Management System
</footer>

</body>
</html>
