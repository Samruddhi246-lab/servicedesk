<!DOCTYPE html>
<html>
<head>

<title>ServiceDesk Login</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>

/* 🌈 ANIMATED BACKGROUND */
body{
margin:0;
height:100vh;
font-family:'Inter',sans-serif;
color:#fff;
overflow:hidden;

background: linear-gradient(-45deg,#0f172a,#1e1b4b,#020617,#1e3a8a);
background-size:400% 400%;
animation:gradientMove 12s ease infinite;
}

@keyframes gradientMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* 🔥 FLOATING GLOW ORBS */
.orb{
position:absolute;
border-radius:50%;
filter:blur(120px);
opacity:0.6;
animation:float 15s infinite alternate;
}

.orb1{
width:300px;height:300px;
background:#8b5cf6;
top:10%;left:10%;
}

.orb2{
width:250px;height:250px;
background:#3b82f6;
bottom:10%;right:10%;
animation-duration:18s;
}

@keyframes float{
0%{transform:translate(0,0);}
100%{transform:translate(80px,-60px);}
}

/* LAYOUT */
.wrapper{
display:flex;
height:100%;
position:relative;
z-index:2;
}

/* LEFT SIDE */
.left{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
padding:100px;
}

.logo{
font-size:60px;
font-family:'Poppins';
margin-bottom:20px;
background:linear-gradient(90deg,#c4b5fd,#60a5fa);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.tagline{
font-size:22px;
color:#ddd;
margin-bottom:20px;
}

.desc{
color:#aaa;
max-width:450px;
line-height:1.6;
}

/* RIGHT */
.right{
flex:1;
display:flex;
justify-content:center;
align-items:center;
}

/* GLASS CARD */
.card-box{
width:400px;
padding:45px;
border-radius:20px;

background:rgba(255,255,255,0.08);
backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,0.15);

box-shadow:
0 0 40px rgba(139,92,246,0.4),
0 0 80px rgba(59,130,246,0.2);

animation:fadeIn 1s ease;
}

/* TITLE */
.title{
text-align:center;
font-size:26px;
margin-bottom:30px;
}

/* INPUT */
.form-control{
background:rgba(255,255,255,0.1);
border:none;
color:white;
padding:14px;
}

.form-control::placeholder{
color:#bbb;
}

.form-control:focus{
box-shadow:0 0 0 2px rgba(139,92,246,0.5);
}

/* BUTTON */
.btn-login{
background:linear-gradient(135deg,#8b5cf6,#3b82f6);
border:none;
padding:14px;
font-weight:600;
transition:0.3s;
}

.btn-login:hover{
transform:translateY(-3px);
box-shadow:0 10px 25px rgba(139,92,246,0.6);
}

/* REGISTER */
.register{
text-align:center;
margin-top:20px;
font-size:14px;
color:#ccc;
}

.register a{
color:#c4b5fd;
text-decoration:none;
}

.register a:hover{
text-decoration:underline;
}

/* ANIMATION */
@keyframes fadeIn{
from{opacity:0; transform:translateY(30px);}
to{opacity:1; transform:translateY(0);}
}

</style>

</head>

<body>

<!-- ORBS -->
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="wrapper">

<!-- LEFT -->
<div class="left">

<div class="logo">ServiceDesk</div>

<div class="tagline">Next-Gen Complaint Management</div>

<div class="desc">
A powerful system designed to simplify complaint tracking,
boost efficiency, and deliver a seamless digital experience.
</div>

</div>

<!-- RIGHT -->
<div class="right">

<div class="card-box">

<div class="title">Sign In</div>

<form method="POST">
{% csrf_token %}

<div class="mb-3">
<input type="text" name="username" class="form-control" placeholder="Username" required>
</div>

<div class="mb-3">
<div class="input-group">
<input type="password" id="password" name="password" class="form-control" placeholder="Password" required>

<button type="button" class="btn btn-dark" onclick="togglePassword()">
<i id="eyeIcon" class="bi bi-eye"></i>
</button>
</div>
</div>

<button class="btn btn-login w-100">Login</button>

</form>

<div class="register">
Don't have an account? <a href="/register/">Register</a>
</div>

</div>

</div>

</div>

<script>
function togglePassword(){
let p=document.getElementById("password");
let i=document.getElementById("eyeIcon");

if(p.type==="password"){
p.type="text";
i.classList.replace("bi-eye","bi-eye-slash");
}else{
p.type="password";
i.classList.replace("bi-eye-slash","bi-eye");
}
}
</script>

</body>
</html>
