<!DOCTYPE html>
<html>
<head>
    <title>Submit Complaint - ServiceDesk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<body>

<nav class="navbar navbar-dark bg-dark">
<div class="container">

<a class="navbar-brand" href="/">ServiceDesk</a>

<div>
<a href="/" class="btn btn-light">Dashboard</a>
<a href="/submit/" class="btn btn-light">Submit</a>
<a href="/track/" class="btn btn-light">Track</a>
<a href="/logout/" class="btn btn-danger">Logout</a>
</div>

</div>
</nav>
<div class="container mt-5">
    <div class="card shadow p-4">
        <h3 class="mb-4">Submit New Complaint</h3>

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label>Title</label>
                {{ form.title }}
            </div>

            <div class="mb-3">
                <label>Description</label>
                {{ form.description }}
            </div>

            <div class="mb-3">
                <label>Status</label>
                {{ form.status }}
            </div>

            <button type="submit" class="btn btn-primary">Submit Complaint</button>
            <a href="/" class="btn btn-secondary">Back</a>
        </form>

    </div>
</div>

</body>
</html>
